<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="error">Calculator</div>

    <div class="calc__container">
      <div class="calc__screen">
        <span class="calc__result"></span>
        <span class="calc__active"></span>
      </div>

      <div class="calc__buttons">
        <table>
          <tr>
            <td>
              <button class="calc__button function" id="allclear">AC</button>
            </td>
            <td>
              <button class="calc__button function" id="clear">CE</button>
            </td>
            <td><button class="calc__button function" id="back">⌫</button></td>
            <td>
              <button class="calc__button operator" id="divide">÷</button>
            </td>
          </tr>
          <tr>
            <td><button class="calc__button number">7</button></td>
            <td><button class="calc__button number">8</button></td>
            <td><button class="calc__button number">9</button></td>
            <td>
              <button class="calc__button operator" id="multiply">×</button>
            </td>
          </tr>
          <tr>
            <td><button class="calc__button number">4</button></td>
            <td><button class="calc__button number">5</button></td>
            <td><button class="calc__button number">6</button></td>
            <td><button class="calc__button operator" id="add">+</button></td>
          </tr>
          <tr>
            <td><button class="calc__button number">1</button></td>
            <td><button class="calc__button number">2</button></td>
            <td><button class="calc__button number">3</button></td>
            <td>
              <button class="calc__button operator" id="subtract">-</button>
            </td>
          </tr>
          <tr>
            <td>
              <button class="calc__button function" id="negative">+/-</button>
            </td>
            <td><button class="calc__button number">0</button></td>
            <td>
              <button class="calc__button function" id="decimal">.</button>
            </td>
            <td><button class="calc__button operator" id="equal">=</button></td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
